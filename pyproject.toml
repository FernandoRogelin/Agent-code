[project]
name = "avaliador-reclamacoes"
version = "0.1.0"
description = "Avaliador de reclamações desenvolvido como projeto de estudo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv>=1.2.3",
]

[project.scripts]
avaliador-reclamacoes = "avaliador_reclamacoes.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

